services:
    app:
        build:
            context: .
        container_name: projectcontoh-app
        restart: unless-stopped
        environment:
            APP_NAME: 'Mini POS'
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: http://localhost:8000
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: project1
            DB_USERNAME: postgres
            DB_PASSWORD: admin
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - app-code:/var/www/html
        networks:
            - app-network

    webserver:
        image: nginx:alpine
        container_name: projectcontoh-webserver
        restart: unless-stopped
        ports:
            - '8000:80'
        volumes:
            - app-code:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app-network

    db:
        image: postgres:17-alpine
        container_name: projectcontoh-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: project1
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: admin
        ports:
            - '5433:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d project1']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:
        driver: local
    # Seeded from the app image on first creation; rebuild the image and run
    # `docker compose down -v` to refresh the application code inside it.
    app-code:
        driver: local
